; WitcherCraft settings (optional). Every value below is the default, so WitcherCraft runs the same
; without this file. To change something, copy this file next to witcher3.exe as
;   bin\x64_dx12\witchercraft_native.ini
; and edit that copy. WitcherCraft updates never replace it.

[WitcherCraft]
; Hide Minecraft blocks behind Witcher objects (depth test). 0 = Minecraft always drawn on top.
OverlayOcclusion=1

[Minecraft]
; Start Minecraft when The Witcher 3 starts. It stays hidden, opens its WitcherCraft world by itself
; once you're in game, and quits when the game closes. 0 = start Minecraft yourself.
StartWithWitcher=1

; Empty: the Minecraft that comes with WitcherCraft (a portable Prism Launcher, unpacked to
; %LOCALAPPDATA%\WitcherCraft; the first time it asks you to sign in with your Microsoft account).
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file) to use that instead.
Launcher=

; What to pass to your own launcher. For Prism: --launch and the name of your WitcherCraft instance.
Arguments=--launch WitcherCraft
