plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--username", (System.getenv("WITCHERCRAFT_USERNAME") ?: "Geralt")
			vmArgs "--enable-native-access=ALL-UNNAMED", "-Dwitchercraft.quitWithSkyrim=false"
			// WitcherCraft world layer: MC renders its blocks/entities/hand into the
			// overlay on a transparent background. -PworldLayer=false gives upstream SkyCraft's HUD-only overlay.
			vmArgs "-Dwitchercraft.worldLayer=" + (project.findProperty("worldLayer") ?: "true")
			// WitcherCraft occlusion: ship Minecraft's depth with each frame. -Pdepth=false turns it off.
			vmArgs "-Dwitchercraft.depth=" + (project.findProperty("depth") ?: "true")
		}
	}

	mods {
		"witchercraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed"; exceptionFormat "full" }
}

// Production-mode check (how Prism runs a release): the built jar plus the release's pinned Fabric API,
// no dev classpath. Needs release\package.ps1 to have downloaded Fabric API once. Run dir: run-prod.
//   gradlew prodClient   (env WITCHERCRAFT_USERNAME picks the offline test player, default WcTest)
tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.named("jar"))
	mods.from(file("../release/.cache/fabric-api-${project.fabric_api_version}.jar"))
	jvmArgs.addAll("--enable-native-access=ALL-UNNAMED", "-Dwitchercraft.quitWithSkyrim=false", "-XX:ErrorFile=" + file("run-prod/hs_err_pid%p.log").absolutePath)
	// -PstartHidden=false keeps the window (the release starts hidden, like Prism's instance)
	jvmArgs.add("-Dwitchercraft.startHidden=" + (project.findProperty("startHidden") ?: "true"))
	programArgs.addAll("--username", System.getenv("WITCHERCRAFT_USERNAME") ?: "WcTest")
	runDir = file("run-prod")
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// WitcherCraft's license, the SkyCraft license it builds on, and Minecraft-Ring's (mobs fighting
	// the Witcher's enemies, WitcherEnemyTargetGoal, is adapted from it).
	from("../LICENSE") {
		rename { "LICENSE_witchercraft" }
	}
	from("LICENSE-SkyCraft.txt")
	from("LICENSE-MinecraftRing.txt")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
